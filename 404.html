<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Raghav Bharadwaj</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Serif:wght@600&display=swap">
  <style>
    :root {
      --ground: #f6f8f9; --ink: #13181d; --muted: #5b6572; --accent-ink: #17495f;
      --serif: "IBM Plex Serif", Georgia, serif;
      --sans: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ground: #0f1317; --ink: #e5eaef; --muted: #8f98a4; --accent-ink: #8ec8e2;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --ground: #0f1317; --ink: #e5eaef; --muted: #8f98a4; --accent-ink: #8ec8e2;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: var(--ground); color: var(--ink);
      font-family: var(--sans); line-height: 1.6;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
    }
    main { max-width: 34ch; }
    .code {
      font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted); margin: 0 0 14px;
    }
    h1 {
      font-family: var(--serif); font-weight: 600; font-size: 1.6rem;
      margin: 0 0 10px; letter-spacing: -0.01em; text-wrap: balance;
    }
    p { margin: 0 0 20px; color: var(--muted); font-size: 0.95rem; }
    a { color: var(--accent-ink); text-decoration: none; font-size: 0.95rem; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>That page doesn't exist.</h1>
    <p>The link may be out of date, or the address slightly off.</p>
    <a href="/">← Back to the homepage</a>
  </main>
</body>
</html>
